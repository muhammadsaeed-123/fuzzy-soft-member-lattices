[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fodm-fuzzy-soft-lattice"
version = "2.1.0"
description = "Reproducibility package for complete fuzzy-soft member lattices and exact path optimization"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "numpy==2.3.5",
  "pandas==2.2.3",
  "scipy==1.17.0",
  "matplotlib==3.10.8"
]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
pythonpath = ["code"]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["code"]
